<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NewsHub — Curated Global Journalism & Breaking News</title>

    <meta
      name="description"
      content="Real-time global news feed featuring curated editorial layouts, fast search, in-app reading mode, and offline bookmarks."
    />
    <meta name="author" content="Kanishk Upadhyay" />
    <meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)" />

    <!-- Instant System / Saved Theme Initialization to prevent flash -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("newshub_theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (saved === "dark" || (!saved && prefersDark)) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kanishk-upadhyay.github.io/news/" />
    <meta property="og:title" content="NewsHub — Curated Global Journalism & Breaking News" />
    <meta
      property="og:description"
      content="Real-time global news feed featuring curated editorial layouts, fast search, in-app reading mode, and offline bookmarks."
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://kanishk-upadhyay.github.io/news/" />
    <meta property="twitter:title" content="NewsHub — Curated Global Journalism" />
    <meta
      property="twitter:description"
      content="Real-time global news feed with editorial layouts, in-app reader, and search."
    />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.json" />

    <!-- Google Fonts: Newsreader (Editorial Serif) + Google Sans Flex (Modern Variable Sans) + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@8..144,300..800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-surface text-on-surface antialiased selection:bg-rose-500 selection:text-white min-h-screen transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
